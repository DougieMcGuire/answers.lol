<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - Answers.lol</title>
<style>
    body { font-family: Arial, sans-serif; background: #F1F8FF; color: #333; margin:0; padding:0;}
    header { background: #4FC3F7; color:white; padding:20px; text-align:center; }
    main { max-width: 600px; margin:20px auto; padding:20px; background:white; border-radius:12px; }
    h1 { color: #0288D1; text-align:center; }
    input, textarea { width:100%; padding:10px; margin:10px 0; border-radius:8px; border:2px solid #E3F2FD; }
    button { background:#4FC3F7; color:white; border:none; padding:12px 20px; border-radius:8px; font-weight:bold; cursor:pointer; }
    button:hover { background:#0288D1; }
</style>
</head>
<body>
<header>
    <h1>Contact Us</h1>
</header>
<main>
    <p>If you have any questions or concerns, fill out the form below and we’ll get back to you.</p>
    <form action="mailto:your-email@domain.com" method="post" enctype="text/plain">
        <input type="text" name="name" placeholder="Your Name" required>
        <input type="email" name="email" placeholder="Your Email" required>
        <textarea name="message" rows="6" placeholder="Your Message" required></textarea>
        <button type="submit">Send Message</button>
    </form>
</main>
</body>
</html>
